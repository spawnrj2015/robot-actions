        gh_access_token: ${{ secrets.GITHUB_TOKEN }}
        report_path: ./logs

    - name: Upload Report
      uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: Firefox Test Report
        path: ./logs
